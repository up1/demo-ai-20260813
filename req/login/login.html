<title>EnterpriseSecure - Sign In</title>

<style>
        body {
            background: linear-gradient(135deg, #f9f9ff 0%, #e7eeff 100%);
        }
        .input-focused:focus-within {
            border-color: #00327d;
            border-width: 2px;
            padding: calc(0.75rem - 1px) calc(1rem - 1px);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 50, 125, 0.1), 0 2px 4px -1px rgba(0, 50, 125, 0.06);
        }

            transform: translateY(0);

<body class="min-h-screen flex flex-col font-body-md text-on-surface antialiased bg-background">
<!-- Top Navigation suppressed due to Login context (The "Destination" Rule) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-ambient-large border border-[#F1F5F9] p-[40px] flex flex-col items-center">
<!-- Brand Logo Placeholder -->
<div class="mb-8 w-16 h-16 rounded-lg bg-surface-container flex items-center justify-center text-primary border border-surface-container-highest">
<span class="material-symbols-outlined text-[32px] font-bold" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Heading -->
<div class="text-center mb-[32px] w-full">
<h1 class="font-headline-md text-headline-md text-on-background mb-2">Sign In to Your Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access the secure portal.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-[16px]">
<!-- Username Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="username">Username or Email</label>
<div class="relative flex items-center w-full border border-outline-variant rounded bg-surface-container-lowest overflow-hidden transition-all duration-200 input-focused">
<span class="material-symbols-outlined text-outline ml-4 absolute pointer-events-none">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="username" name="username" placeholder="name@company.com" type="text">
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center w-full border border-outline-variant rounded bg-surface-container-lowest overflow-hidden transition-all duration-200 input-focused">
<span class="material-symbols-outlined text-outline ml-4 absolute pointer-events-none">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="password" name="password" placeholder="••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-4 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Utilities Row -->
<div class="flex items-center justify-between mt-2 mb-4 w-full">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest transition-colors" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors underline-offset-2 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded transition-all duration-200 btn-hover btn-active flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="mt-8 text-center w-full pt-6 border-t border-surface-container-high">
<span class="font-body-md text-body-md text-on-surface-variant">New to EnterpriseSecure?</span>
<a class="font-label-md text-label-md text-primary ml-1 hover:text-primary-container transition-colors hover:underline underline-offset-4" href="#">Sign up</a>
</div>
</div>
</main>
<!-- Shared Component: Footer -->
<footer class="bg-transparent text-secondary dark:text-secondary-fixed font-label-sm text-label-sm fixed bottom-0 w-full no-border flat no shadows transition-all duration-200 flex justify-center gap-gutter pb-8 w-full z-10">
<div class="flex gap-gutter items-center">



</div>
</footer>


</body></html>
